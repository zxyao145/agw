name: Server Build

on:
  pull_request:
  push:
    branches: [ "main" ]

  workflow_dispatch:
    
jobs:

  changes:
    name: server changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      # push / workflow_dispatch 始终运行完整构建；PR 只在改到服务端路径时运行
      # push / workflow_dispatch always run the full build; PRs run only when server paths change
      server: ${{ github.event_name != 'pull_request' || steps.filter.outputs.server == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            server:
              - 'Dockerfile'
              - '.dockerignore'
              - 'src/server/**'
              - 'src/sdks/**'
              - 'tests/**'
              - 'Agw.slnx'
              - '.github/workflows/build-server.yml'
              - '.github/scripts/**'
              - '.github/postgres-tests.json'

  build:
    name: test
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
    - uses: actions/checkout@v7
      

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Audit dependencies
      run: dotnet restore Agw.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1900%3BNU1903%3BNU1904

    - name: build
      run: |
        dotnet test ./Agw.slnx -c Release --no-restore

    - name: Build Docker image
      run: docker build --tag agw:ci .

  windows:
    name: Windows file systems
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # 每个测试项目单独一个步骤：pwsh 的多行脚本只按最后一条命令的退出码判断步骤结果
      # One step per test project: a multi-line pwsh script fails the step only on the last command's exit code
      - name: Test Files on Windows
        run: dotnet test --project tests/Agw.Files.Tests/Agw.Files.Tests.csproj -c Release
      - name: Test Tools on Windows
        run: dotnet test --project tests/Agw.Tools.Tests/Agw.Tools.Tests.csproj -c Release

  postgres:
    name: PostgreSQL correctness
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agw_test
          POSTGRES_PASSWORD: agw_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agw_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGW_TEST_POSTGRES_CONNECTION_STRING: "Host=localhost;Port=5432;Username=agw_test;Password=agw_test;Database=postgres;Pooling=false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build PostgreSQL test projects
        run: |
          dotnet build tests/Agw.Agents.Tests -c Release
          dotnet build tests/Agw.Jobs.Tests -c Release
          dotnet build tests/Agw.Files.Tests -c Release
      - name: Configure Jobs and Files PostgreSQL tests
        run: |
          mkdir -p .scratch
          cp .github/postgres-tests.json .scratch/postgres-tests.json
      - name: Test PostgreSQL fencing, event ordering, upgrades and scheduler capacity
        run: >-
          tests/Agw.Agents.Tests/bin/Release/net10.0/Agw.Agents.Tests
          -filterVSTest "FullyQualifiedName~DurableDistributedStoreTests.Postgres_|FullyQualifiedName~DurableTurnUpgradeTests.Postgres_|FullyQualifiedName~DurableSchedulerTests.Postgres_"
          -result-trx TestResults/Postgres/results.trx
          -failSkips
      - name: Test PostgreSQL job deletion and execution locks
        run: >-
          tests/Agw.Jobs.Tests/bin/Release/net10.0/Agw.Jobs.Tests
          -filterVSTest "Category=Postgres"
          -result-trx TestResults/Postgres/jobs.trx
          -failSkips
      - name: Test PostgreSQL file write serialization across Hosts
        run: >-
          tests/Agw.Files.Tests/bin/Release/net10.0/Agw.Files.Tests
          -filterVSTest "Category=Postgres"
          -result-trx TestResults/Postgres/files.trx
          -failSkips
      - name: Require actual PostgreSQL test execution
        run: python3 .github/scripts/verify-postgres-tests.py TestResults/Postgres
