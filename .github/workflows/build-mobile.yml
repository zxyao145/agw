name: Mobile Build

on:
  pull_request:
    paths:
      - "src/clients/mobile/**"
      - "src/clients/packages/**"
      - "src/clients/package.json"
      - "src/clients/pnpm-workspace.yaml"
      - "src/clients/pnpm-lock.yaml"
      - ".github/workflows/build-mobile.yml"
  push:
    branches: [main]
    paths:
      - "src/clients/mobile/**"
      - "src/clients/packages/**"
      - "src/clients/package.json"
      - "src/clients/pnpm-workspace.yaml"
      - "src/clients/pnpm-lock.yaml"
      - ".github/workflows/build-mobile.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Optional build version in X.Y.Z or X.Y.Z-{preview|alpha|beta}.N format
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Mobile build version
        required: false
        type: string

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      ios_version: ${{ steps.version.outputs.ios_version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve build version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          version="${INPUT_VERSION:-0.0.${GITHUB_RUN_NUMBER}}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(preview|alpha|beta)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Version must use X.Y.Z or X.Y.Z-{preview|alpha|beta}.N format." >&2
            exit 2
          fi

          echo "ios_version=${version%%-*}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  mobile-test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/clients
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/clients/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agw/mobile test
      - run: pnpm --filter @agw/mobile typecheck

  android-build:
    needs: [metadata, mobile-test]
    name: build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/clients
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/clients/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate Android project
        env:
          AGW_APP_VERSION: ${{ needs.metadata.outputs.version }}
          AGW_BUILD_NUMBER: ${{ github.run_number }}
        run: >-
          pnpm --filter @agw/mobile exec expo prebuild
          --platform android
          --clean
          --no-install
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android NDK
        run: sdkmanager "ndk;27.1.12297006"
      - name: Build debug-signed Android release APK
        working-directory: src/clients/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Collect Android artifact
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/release-artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
            "mobile/release-artifacts/Agw-Mobile-${APP_VERSION}-android-debug-signed.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: agw-mobile-android
          path: src/clients/mobile/release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-build:
    needs: [metadata, mobile-test]
    name: build iOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: src/clients
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/clients/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate iOS project
        env:
          AGW_APP_VERSION: ${{ needs.metadata.outputs.ios_version }}
          AGW_BUILD_NUMBER: ${{ github.run_number }}
        run: >-
          pnpm --filter @agw/mobile exec expo prebuild
          --platform ios
          --clean
          --no-install
      - name: Install iOS pods
        working-directory: src/clients/mobile
        run: pod install --project-directory=ios
      - name: Build unsigned iOS archive
        working-directory: src/clients/mobile
        run: |
          xcodebuild \
            -workspace ios/Agw.xcworkspace \
            -scheme Agw \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/Agw.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
      - name: Package unsigned iOS IPA
        working-directory: src/clients/mobile
        env:
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/Agw.xcarchive/Products/Applications/Agw.app"
          if [[ ! -d "$app_path" ]]; then
            echo "Expected iOS app at $app_path." >&2
            exit 2
          fi

          mkdir -p "$RUNNER_TEMP/Payload" release-artifacts
          ditto "$app_path" "$RUNNER_TEMP/Payload/Agw.app"
          (
            cd "$RUNNER_TEMP"
            /usr/bin/zip -qry \
              "$GITHUB_WORKSPACE/src/clients/mobile/release-artifacts/Agw-Mobile-${APP_VERSION}-ios-unsigned.ipa" \
              Payload
          )
      - uses: actions/upload-artifact@v7
        with:
          name: agw-mobile-ios
          path: src/clients/mobile/release-artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7
