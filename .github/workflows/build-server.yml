name: Server Build

on:
  pull_request:
    paths:
      - "src/server/**"
      - "src/sdks/**"
  push:
    branches: [ "main" ]

  workflow_dispatch:
    
jobs:

  build:
    name: test
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
    - uses: actions/checkout@v7
      

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: build
      run: |
        dotnet test ./Agw.slnx -c Release

    - name: Build Docker image
      run: docker build --tag agw:ci .

