name: Web Build

on:
  workflow_call:
    inputs:
      package-checks:
        description: Run Web package checks, component tests and the production build
        type: boolean
        default: true

defaults:
  run:
    working-directory: src

jobs:
  checks:
    name: Package checks and production build
    if: inputs.package-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run format:check lint --filter=@agw/web...
      - run: pnpm exec turbo run test --filter=@agw/web... --concurrency=4
      - run: pnpm exec turbo run build --filter=@agw/web...

  browser:
    name: Browser tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [components, agentflow, other-e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: pnpm --filter @agw/web exec playwright install --with-deps chromium
      - name: Build Standalone Host
        working-directory: .
        run: dotnet build src/server/Agw.Standalone.Host
      - name: Test browser components
        if: matrix.suite == 'components' && inputs.package-checks
        run: |
          pnpm --filter @agw/chat test:browser
          pnpm --filter @agw/code-view test:browser
          pnpm --filter @agw/projects test:browser
      - name: Test Server images and static export
        if: matrix.suite == 'components'
        run: |
          pnpm --filter @agw/chat test:server-images
          pnpm --filter @agw/web test:e2e:export
      - name: Test Web end to end
        if: matrix.suite != 'components'
        run: >-
          pnpm --filter @agw/web test:e2e
          ${{ matrix.suite == 'agentflow' && '--grep' || '--grep-invert' }}
          'agentflow-.*\.spec\.ts'
