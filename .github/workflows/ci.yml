name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      boundaries: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.boundaries == 'true' }}
      server: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.server == 'true' }}
      docker: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      web_packages: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web_packages == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
      installers: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.installers == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: .github/ci-paths.yml

  boundaries:
    name: Client import boundaries
    needs: changes
    # Desktop 测试也会检查整个工作区的导入规则。Desktop tests include the workspace-wide import check.
    if: needs.changes.outputs.boundaries == 'true' && needs.changes.outputs.desktop != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: src
      - run: pnpm test:boundaries
        working-directory: src

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/build-web.yml
    with:
      package-checks: ${{ needs.changes.outputs.web_packages == 'true' }}

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/build-desktop.yml
    with:
      smoke-only: ${{ needs.changes.outputs.installers != 'true' }}

  server:
    name: Server tests
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    environment: prod

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Audit dependencies
      run: dotnet restore Agw.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1900%3BNU1903%3BNU1904

    - uses: ./.github/actions/setup-pnpm

    - name: Install Pi CLI startup test dependency
      run: npm ci --prefix src/sdks/pi-agent-sdk-csharp/tests/fixtures/pi-cli --ignore-scripts --no-audit --no-fund

    - name: Install Codex app-server test dependency
      run: npm ci --prefix tests/Agw.Agents.Tests/fixtures/codex-app-server --ignore-scripts --no-audit --no-fund

    - name: Install Redis test dependency
      run: sudo apt-get update && sudo apt-get install --yes redis-server

    - name: Install extension workspace dependencies
      working-directory: src
      run: pnpm install --frozen-lockfile

    - name: Build Server extension packages
      working-directory: src
      run: >-
        pnpm --filter @agw/extension-feishu --filter @agw/extension-taskpilot
        --workspace-concurrency=1 run build

    - name: Run solution tests
      run: dotnet test ./Agw.slnx -c Release --no-restore

  docker:
    name: Build Docker image
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag agw:ci .

  windows:
    name: Windows file systems
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # 每个测试项目单独一个步骤：pwsh 的多行脚本只按最后一条命令的退出码判断步骤结果
      # One step per test project: a multi-line pwsh script fails the step only on the last command's exit code
      - name: Test Files on Windows
        run: dotnet test --project tests/Agw.Files.Tests/Agw.Files.Tests.csproj -c Release
      - name: Test Tools on Windows
        run: dotnet test --project tests/Agw.Tools.Tests/Agw.Tools.Tests.csproj -c Release

  postgres:
    name: PostgreSQL correctness
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agw_test
          POSTGRES_PASSWORD: agw_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agw_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGW_TEST_POSTGRES_CONNECTION_STRING: "Host=localhost;Port=5432;Username=agw_test;Password=agw_test;Database=postgres;Pooling=false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build PostgreSQL test projects
        run: |
          dotnet build tests/Agw.Agents.Tests -c Release
          dotnet build tests/Agw.Jobs.Tests -c Release
          dotnet build tests/Agw.Projects.Tests -c Release
          dotnet build tests/Agw.Files.Tests -c Release
          dotnet build tests/Agw.Events.Tests -c Release
          dotnet build tests/Agw.Extensions.Database.Tests -c Release
          dotnet build tests/Agw.Extensions.Runtime.Tests -c Release
      - name: Configure PostgreSQL test databases
        run: |
          mkdir -p .scratch
          cp .github/postgres-tests.json .scratch/postgres-tests.json
      - name: Test PostgreSQL fencing, event ordering, upgrades and scheduler capacity
        run: >-
          tests/Agw.Agents.Tests/bin/Release/net10.0/Agw.Agents.Tests
          -filterVSTest "FullyQualifiedName~DurableDistributedStoreTests.Postgres_|FullyQualifiedName~DurableTurnUpgradeTests.Postgres_|FullyQualifiedName~DurableSchedulerTests.Postgres_|FullyQualifiedName~TurnAcceptanceLockTests.Postgres_"
          -result-trx TestResults/Postgres/results.trx
          -failSkips
      - name: Test PostgreSQL job writes
        run: >-
          tests/Agw.Jobs.Tests/bin/Release/net10.0/Agw.Jobs.Tests
          -filterVSTest "Category=Postgres"
          -result-trx TestResults/Postgres/jobs.trx
          -failSkips
      - name: Test PostgreSQL Jobs/Event Timer migration
        run: >-
          tests/Agw.Projects.Tests/bin/Release/net10.0/Agw.Projects.Tests
          -filterVSTest "FullyQualifiedName~JobsEventTimerMigrationTests.Upgrade_Postgres_"
          -result-trx TestResults/Postgres/jobs-migration.trx
          -failSkips
      - name: Test PostgreSQL file write serialization across Hosts
        run: >-
          tests/Agw.Files.Tests/bin/Release/net10.0/Agw.Files.Tests
          -filterVSTest "Category=Postgres"
          -result-trx TestResults/Postgres/files.trx
          -failSkips
      - name: Test PostgreSQL event list paging
        run: >-
          tests/Agw.Events.Tests/bin/Release/net10.0/Agw.Events.Tests
          -filterVSTest "Category=Postgres"
          -result-trx TestResults/Postgres/events.trx
          -failSkips
      - name: Test PostgreSQL extension migrations, isolation and settings propagation
        run: >-
          tests/Agw.Extensions.Database.Tests/bin/Release/net10.0/Agw.Extensions.Database.Tests
          -filterVSTest "Category=Postgres"
          -result-trx TestResults/Postgres/extensions-database.trx
          -failSkips
      - name: Test collectible extension with private PostgreSQL dependencies
        run: >-
          tests/Agw.Extensions.Runtime.Tests/bin/Release/net10.0/Agw.Extensions.Runtime.Tests
          -filterVSTest "Category=Postgres"
          -result-trx TestResults/Postgres/extensions-runtime.trx
          -failSkips
      - name: Require actual PostgreSQL test execution
        run: python3 .github/scripts/verify-postgres-tests.py TestResults/Postgres

  test:
    needs: [changes, boundaries, server, windows, postgres, docker, web, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check selected job results
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key) = \(.value.result)"' <<< "$JOBS"
          jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<< "$JOBS"
