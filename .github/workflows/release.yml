name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag in vX.Y.Z or vX.Y.Z-{preview|alpha|beta}.N format
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.release.outputs.image_name }}
      image_tags: ${{ steps.release.outputs.image_tags }}
      control_plane_image_name: ${{ steps.release.outputs.control_plane_image_name }}
      control_plane_image_tags: ${{ steps.release.outputs.control_plane_image_tags }}
      data_plane_image_name: ${{ steps.release.outputs.data_plane_image_name }}
      data_plane_image_tags: ${{ steps.release.outputs.data_plane_image_tags }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release metadata
        id: release
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$MANUAL_RELEASE_TAG"
          fi

          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(preview|alpha|beta)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Release tag must use vX.Y.Z or vX.Y.Z-{preview|alpha|beta}.N format." >&2
            exit 2
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && \
            git show-ref --verify --quiet "refs/tags/$release_tag"; then
            tagged_commit="$(git rev-list -n 1 "refs/tags/$release_tag")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "$release_tag already points to $tagged_commit instead of $GITHUB_SHA." >&2
              exit 2
            fi
          fi

          version="${release_tag#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          image_name="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          control_plane_image_name="$image_name-control-plane"
          data_plane_image_name="$image_name-data-plane"
          short_sha="${GITHUB_SHA:0:12}"
          if [[ "$prerelease" == "false" ]]; then
            IFS=. read -r major minor _patch <<< "$version"
            image_tags=$(printf '%s\n' \
              "$image_name:$version" \
              "$image_name:$major.$minor" \
              "$image_name:$major" \
              "$image_name:latest" \
              "$image_name:sha-$short_sha")
            control_plane_image_tags=$(printf '%s\n' \
              "$control_plane_image_name:$version" \
              "$control_plane_image_name:$major.$minor" \
              "$control_plane_image_name:$major" \
              "$control_plane_image_name:latest" \
              "$control_plane_image_name:sha-$short_sha")
            data_plane_image_tags=$(printf '%s\n' \
              "$data_plane_image_name:$version" \
              "$data_plane_image_name:$major.$minor" \
              "$data_plane_image_name:$major" \
              "$data_plane_image_name:latest" \
              "$data_plane_image_name:sha-$short_sha")
          else
            image_tags=$(printf '%s\n' \
              "$image_name:$version" \
              "$image_name:sha-$short_sha")
            control_plane_image_tags=$(printf '%s\n' \
              "$control_plane_image_name:$version" \
              "$control_plane_image_name:sha-$short_sha")
            data_plane_image_tags=$(printf '%s\n' \
              "$data_plane_image_name:$version" \
              "$data_plane_image_name:sha-$short_sha")
          fi

          {
            echo "image_name=$image_name"
            echo "control_plane_image_name=$control_plane_image_name"
            echo "data_plane_image_name=$data_plane_image_name"
            echo "prerelease=$prerelease"
            echo "release_tag=$release_tag"
            echo "version=$version"
            echo "image_tags<<EOF"
            echo "$image_tags"
            echo "EOF"
            echo "control_plane_image_tags<<EOF"
            echo "$control_plane_image_tags"
            echo "EOF"
            echo "data_plane_image_tags<<EOF"
            echo "$data_plane_image_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  desktop-build:
    needs: metadata
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ needs.metadata.outputs.version }}

  docker-build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        role:
          - name: standalone
            target: standalone
          - name: control-plane
            target: control-plane
          - name: data-plane
            target: data-plane
        platform:
          - name: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: image
        env:
          ROLE: ${{ matrix.role.name }}
          STANDALONE_IMAGE_NAME: ${{ needs.metadata.outputs.image_name }}
          CONTROL_PLANE_IMAGE_NAME: ${{ needs.metadata.outputs.control_plane_image_name }}
          DATA_PLANE_IMAGE_NAME: ${{ needs.metadata.outputs.data_plane_image_name }}
        shell: bash
        run: |
          case "$ROLE" in
            standalone) image_name="$STANDALONE_IMAGE_NAME" ;;
            control-plane) image_name="$CONTROL_PLANE_IMAGE_NAME" ;;
            data-plane) image_name="$DATA_PLANE_IMAGE_NAME" ;;
            *) exit 2 ;;
          esac
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image by digest
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform.name }}
          target: ${{ matrix.role.target }}
          build-args: APP_VERSION=${{ needs.metadata.outputs.version }}
          labels: org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          outputs: type=image,name=${{ steps.image.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agw-docker-${{ matrix.role.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=agw-docker-${{ matrix.role.name }}-${{ matrix.platform.arch }}
      - name: Export Docker digest
        env:
          DIGEST: ${{ steps.docker.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: agw-docker-digest-${{ matrix.role.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    needs: [metadata, docker-build, desktop-build]
    strategy:
      matrix:
        role: [standalone, control-plane, data-plane]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: agw-docker-digest-${{ matrix.role }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image metadata
        id: image
        env:
          ROLE: ${{ matrix.role }}
          STANDALONE_IMAGE_NAME: ${{ needs.metadata.outputs.image_name }}
          STANDALONE_IMAGE_TAGS: ${{ needs.metadata.outputs.image_tags }}
          CONTROL_PLANE_IMAGE_NAME: ${{ needs.metadata.outputs.control_plane_image_name }}
          CONTROL_PLANE_IMAGE_TAGS: ${{ needs.metadata.outputs.control_plane_image_tags }}
          DATA_PLANE_IMAGE_NAME: ${{ needs.metadata.outputs.data_plane_image_name }}
          DATA_PLANE_IMAGE_TAGS: ${{ needs.metadata.outputs.data_plane_image_tags }}
        shell: bash
        run: |
          case "$ROLE" in
            standalone)
              image_name="$STANDALONE_IMAGE_NAME"
              image_tags="$STANDALONE_IMAGE_TAGS"
              ;;
            control-plane)
              image_name="$CONTROL_PLANE_IMAGE_NAME"
              image_tags="$CONTROL_PLANE_IMAGE_TAGS"
              ;;
            data-plane)
              image_name="$DATA_PLANE_IMAGE_NAME"
              image_tags="$DATA_PLANE_IMAGE_TAGS"
              ;;
            *) exit 2 ;;
          esac
          {
            echo "image_name=$image_name"
            echo "image_tags<<EOF"
            echo "$image_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Publish Docker manifest
        env:
          DIGESTS_DIR: ${{ runner.temp }}/digests
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
          IMAGE_TAGS: ${{ steps.image.outputs.image_tags }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t digests < <(find "$DIGESTS_DIR" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected 2 Docker digests, found ${#digests[@]}." >&2
            exit 2
          fi

          tag_options=()
          while IFS= read -r image_tag; do
            [[ -n "$image_tag" ]] && tag_options+=(--tag "$image_tag")
          done <<< "$IMAGE_TAGS"

          image_sources=()
          for digest in "${digests[@]}"; do
            image_sources+=("$IMAGE_NAME@sha256:$digest")
          done

          docker buildx imagetools create "${tag_options[@]}" "${image_sources[@]}"
      - name: Verify published platforms
        run: >-
          docker buildx imagetools inspect
          "${{ steps.image.outputs.image_name }}:${{ needs.metadata.outputs.version }}"

  release:
    needs: [metadata, docker-publish, desktop-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: agw-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release and attach Desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            find artifacts -type f \( \
              -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.zip' \
            \) \
              -print0 | sort -z
          )
          if [[ "${#files[@]}" -ne 9 ]]; then
            echo "Expected 9 Desktop assets, found ${#files[@]}." >&2
            exit 2
          fi

          tag_options=()
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_options+=(--verify-tag)
          else
            tag_options+=(--target "$GITHUB_SHA")
          fi

          release_options=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_options+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${files[@]}"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Agw $RELEASE_TAG" \
              --draft=false \
              --prerelease="$PRERELEASE"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Agw $RELEASE_TAG" \
              --generate-notes \
              "${tag_options[@]}" \
              "${release_options[@]}" \
              "${files[@]}"
          fi
