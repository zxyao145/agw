name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional build version in X.Y.Z or X.Y.Z-{preview|alpha|beta}.N format
        required: false
        type: string
  workflow_call:
    inputs:
      smoke-only:
        description: Build the Linux x64 client installer
        type: boolean
        default: false
      version:
        description: Desktop build version
        required: false
        type: string

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      installers: ${{ steps.matrix.outputs.installers }}
    steps:
      - name: Resolve build version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          version="${INPUT_VERSION:-0.0.${GITHUB_RUN_NUMBER}}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(preview|alpha|beta)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Version must use X.Y.Z or X.Y.Z-{preview|alpha|beta}.N format." >&2
            exit 2
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Select installers
        id: matrix
        run: |
          installers=$(jq -cn --argjson smoke '${{ toJSON(inputs.smoke-only || false) }}' '[
            {platform: "linux",   runner: "ubuntu-latest", arch: "x64"},
            {platform: "windows", runner: "windows-latest", arch: "x64"},
            {platform: "macos",   runner: "macos-15-intel", arch: "x64"},
            {platform: "macos",   runner: "macos-15", arch: "arm64"}
          ] | [.[] + {flavor: ("client", "full")} |
               select($smoke == false or (.platform == "linux" and .flavor == "client"))]')
          echo "installers=$installers" >> "$GITHUB_OUTPUT"

  desktop-test:
    name: Desktop tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/clients
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:boundaries
      - run: pnpm exec turbo run test --filter=@agw/desktop

  desktop-build:
    needs: [metadata, desktop-test]
    name: build Desktop ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.flavor }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.installers) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src/clients
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg desktop-file-utils
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        run: >-
          pnpm release:desktop --
          --flavor ${{ matrix.flavor }}
          --arch ${{ matrix.arch }}
          --version ${{ needs.metadata.outputs.version }}
      - name: Verify installed Windows icons
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./desktop/scripts/test-installed-icons.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: agw-desktop-${{ matrix.flavor }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: src/clients/desktop/release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
