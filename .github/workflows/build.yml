name: Docker Image CI

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:
    
jobs:

  build:
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
    - uses: actions/checkout@v7
      

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: build and test
      run: |
        dotnet build ./Agw.slnx -c Release
        dotnet test ./Agw.slnx -c Release --no-build

