x-deployment-environment: &deployment-environment
  Database__Provider: postgres
  Database__ConnectionString: "${AGW_DATABASE_CONNECTION_STRING:?Set the complete PostgreSQL connection string}"
  Execution__Provider: Distributed
  DistributedLock__Provider: postgres
  DistributedLock__ConnectionString: ""

x-event-transport-command: &event-transport-command
  - "--Events:Transport:Provider=Redis"
  - "--Events:Transport:Redis:ConnectionString=redis:6379"

services:
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - agw

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agw
      POSTGRES_USER: agw
      POSTGRES_PASSWORD: "${AGW_POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agw

  control-plane:
    image: ghcr.io/zxyao145/agw-control-plane:latest
    restart: unless-stopped
    command: *event-transport-command
    ports:
      - "127.0.0.1:30816:8080"
    environment:
      <<: *deployment-environment
      Setup__AdminPassword: "${AGW_ADMIN_PASSWORD}"
    volumes:
      - agw-data:/data
      - "${AGW_WORKSPACES_PATH:-./workspaces}:/workspaces"
    depends_on:
      - postgres
      - redis
    networks:
      - agw

  data-plane:
    image: ghcr.io/zxyao145/agw-data-plane:latest
    restart: unless-stopped
    command: *event-transport-command
    ports:
      - "127.0.0.1:30817:8080"
    environment:
      <<: *deployment-environment
    volumes:
      - agw-data:/data
      - "${AGW_WORKSPACES_PATH:-./workspaces}:/workspaces"
    depends_on:
      - control-plane
      - redis
    networks:
      - agw

volumes:
  agw-data:
  postgres-data:
  redis-data:

networks:
  agw:
