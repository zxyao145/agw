name: Web CI

on:
  pull_request:
    paths:
      - "src/clients/web/**"
      - "src/clients/packages/**"
      - "src/clients/package.json"
      - "src/clients/pnpm-workspace.yaml"
      - "src/clients/pnpm-lock.yaml"
      - "src/clients/turbo.json"
      - ".github/workflows/web.yml"
  push:
    branches: ["main"]
    paths:
      - "src/clients/web/**"
      - "src/clients/packages/**"
      - "src/clients/package.json"
      - "src/clients/pnpm-workspace.yaml"
      - "src/clients/pnpm-lock.yaml"
      - "src/clients/turbo.json"
      - ".github/workflows/web.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/clients

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/clients/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:boundaries
      # - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec turbo run format:check --filter=@agw/web...
      - run: pnpm exec turbo run lint --filter=@agw/web...
      - run: pnpm exec turbo run test --filter=@agw/web...
      # - run: pnpm test:e2e
      - run: pnpm exec turbo run build --filter=@agw/web...

      # - uses: actions/upload-artifact@v4
      #   if: failure()
      #   with:
      #     name: playwright-results
      #     path: src/clients/web/test-results
      #     if-no-files-found: ignore
      #     retention-days: 7
