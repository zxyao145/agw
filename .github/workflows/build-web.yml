name: Web Build

on:
  pull_request:
    paths:
      - "src/clients/web/**"
      - "src/clients/packages/**"
      - "src/server/Agw.Files/**"
      - "src/server/Agw.Projects/**"
      - "src/clients/package.json"
      - "src/clients/pnpm-workspace.yaml"
      - "src/clients/pnpm-lock.yaml"
      - "src/clients/turbo.json"
      - ".github/workflows/build-web.yml"
  push:
    branches: ["main"]
    paths:
      - "src/clients/web/**"
      - "src/clients/packages/**"
      - "src/server/Agw.Files/**"
      - "src/server/Agw.Projects/**"
      - "src/clients/package.json"
      - "src/clients/pnpm-workspace.yaml"
      - "src/clients/pnpm-lock.yaml"
      - "src/clients/turbo.json"
      - ".github/workflows/web.yml"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/clients

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/clients/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/clients/pnpm-lock.yaml

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:boundaries
      - run: pnpm --filter @agw/web exec playwright install --with-deps chromium
      - run: pnpm exec turbo run format:check --filter=@agw/web...
      - run: pnpm exec turbo run lint --filter=@agw/web...
      - run: pnpm exec turbo run test --filter=@agw/web...
      - run: pnpm --filter @agw/chat test:browser
      - name: Build image test Server
        run: dotnet build src/server/Agw.Standalone.Host
        working-directory: .
      - run: pnpm --filter @agw/chat test:server-images
      - run: pnpm --filter @agw/code-view test:browser
      - run: pnpm --filter @agw/projects test:browser
      - run: pnpm --filter @agw/web test:e2e
      - run: pnpm --filter @agw/web test:e2e:export
      - run: pnpm exec turbo run build --filter=@agw/web...

      # - uses: actions/upload-artifact@v4
