services:
  agw:
    image: ghcr.io/zxyao145/agw:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:30816:8080"
    environment:
      AllowedHosts: "agw.example.com"
      ReverseProxy__TrustedProxies__0: "172.28.0.1"
    volumes:
      - agw-data:/data
    networks:
      - agw

volumes:
  agw-data:

networks:
  agw:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
