pluginManagement { includeBuild("../shared/node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
def isWindows = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")
def reactNativeCliConfigCommand = isWindows ?
    ["cmd", "/c", "npx", "@react-native-community/cli", "config"] :
    ["npx", "@react-native-community/cli", "config"]
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  ex.autolinkLibrariesFromCommand(
    reactNativeCliConfigCommand,
    file("../shared"),
    files("../shared/yarn.lock", "../shared/package-lock.json", "../shared/package.json", "../shared/react-native.config.js")
  )
}
rootProject.name = 'FeAndroid'
include ':app'
includeBuild('../shared/node_modules/@react-native/gradle-plugin')
