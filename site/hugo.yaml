title: AGW Docs
baseURL: https://docs.agw-ai.dev/
publishDir: public/docs
resourceDir: .cache/docs-resources
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
timeZone: UTC
frontmatter:
  lastmod: [lastmod]
languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    hasCJKLanguage: true
    params:
      description: AGW 文档：快速开始、功能指南、部署运维和开发。
    menus:
      main:
        - {name: 快速开始, pageRef: /docs/start/first-chat, weight: 10}
        - {name: 下载, url: 'https://github.com/zxyao145/agw/releases', weight: 30}
        - {name: 首页, url: 'https://agw-ai.dev/zh/', weight: 40}
  en:
    label: English
    locale: en-US
    weight: 1
    params:
      description: AGW documentation for getting started, features, operations, and development.
    menus:
      main:
        - {name: Quick start, pageRef: /docs/start/first-chat, weight: 10}
        - {name: Downloads, url: 'https://github.com/zxyao145/agw/releases', weight: 30}
        - {name: Home, url: 'https://agw-ai.dev/', weight: 40}
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false
outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]
params:
  logo: icons/logo.svg
  offline_search: true
  github_repo: https://github.com/zxyao145/agw
  github_branch: main
  github_subdir: site
  copyright:
    authors: '[AGW contributors](https://github.com/zxyao145/agw)'
    from_year: 2026
  ui:
    theme_color: '#3155d9'
    typography: system
    dark_mode: true
    image_zoom: true
    section_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true
    footer_style: slim
module:
  workspace: 'off'
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.165.0
