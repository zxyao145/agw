faq:
  eyebrow: Before you start
  title: A few practical questions
  items:
    - question: Does AGW include model hosting?
      answer: AGW connects to your configured model providers or invokes external agent CLIs you have set up. Model credits are not included; remote model usage follows the provider's billing rules.
    - question: Should I install Desktop Full or Client?
      answer: Full includes a current-user Server daemon and suits a local start. Client connects to an existing Server. Both share an application identity, so install one variant.
    - question: Can I run unattended tasks?
      answer: Jobs support scheduled and recurring execution, and Agentflows orchestrate multiple steps. Verify the target agent, tool permissions, and inputs first, then inspect execution records. Unattended jobs cannot automatically complete steps requiring human approval or input; adjust the task and permissions before scheduling.
    - question: Is the current version stable?
      answer: AGW is in active development before 1.0. Database schemas, APIs, and interfaces may change between releases. Read the release notes and back up your data before upgrading.
