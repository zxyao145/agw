name: Site Build and Deploy

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and validate home and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        shell: bash
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: site/go.mod
          cache: false

      - name: Read GitHub Pages configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Install Hugo Extended
        run: |
          set -euo pipefail
          hugo_version="0.165.0"
          archive="hugo_extended_${hugo_version}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${hugo_version}"
          curl --fail --silent --show-error --location --retry 3 \
            "$release/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location --retry 3 \
            "$release/hugo_${hugo_version}_checksums.txt" --output "$RUNNER_TEMP/hugo-checksums.txt"
          cd "$RUNNER_TEMP"
          awk -v archive="$archive" '$2 == archive { print }' hugo-checksums.txt > hugo-checksum.txt
          test -s hugo-checksum.txt
          sha256sum --check hugo-checksum.txt
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Build and check
        run: |
          ./scripts/hugo.sh home --cleanDestinationDir --gc --minify \
            --environment production --printPathWarnings --panicOnWarning
          ./scripts/hugo.sh docs --cleanDestinationDir --gc --minify \
            --environment production --printPathWarnings --panicOnWarning
          python3 scripts/check-site.py public/home --site home
          python3 scripts/check-site.py public/docs --site docs

      - name: Build and check GitHub Pages documentation mirror
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./scripts/hugo.sh docs --cleanDestinationDir --gc --minify \
            --environment production --printPathWarnings --panicOnWarning \
            --destination .cache/github-pages --baseURL https://zxyao145.github.io/agw/
          python3 scripts/check-site.py .cache/github-pages --site docs \
            --base-url https://zxyao145.github.io/agw/ --peer-directory public/home

      - name: Upload verified GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.cache/github-pages

      - name: Upload verified Cloudflare Pages sites
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-sites
          path: site/public
          if-no-files-found: error

  deploy-cloudflare:
    name: Deploy ${{ matrix.site }} to Cloudflare Pages
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - site: home
            project: agw-home
            url: https://agw-ai.dev/
          - site: docs
            project: agw-docs
            url: https://docs.agw-ai.dev/
    environment:
      name: github-pages
      url: ${{ matrix.url }}
    steps:
      - name: Download verified sites
        uses: actions/download-artifact@v7
        with:
          name: cloudflare-sites
          path: site/public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/public/${{ matrix.site }} --project-name=${{ matrix.project }} --branch=main

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
