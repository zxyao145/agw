faq:
  eyebrow: 开始之前
  title: 常见问题
  items:
    - question: AGW 包含模型服务吗？
      answer: AGW 连接你配置的模型提供商，或调用已经配置好的外部 Agent CLI。它不附带模型额度；远程模型的使用按对应提供商规则计费。
    - question: 桌面版选 Full 还是 Client？
      answer: 第一次在本机使用，选 Full：它包含客户端和 Server 后台服务。如果已经有可连接的 Server，选 Client。两种安装包使用相同的应用标识，只需安装其中一种。
    - question: 可以自动执行定时任务吗？
      answer: 可以。用 Jobs 设置执行时间，用 Agentflows 组织多个步骤。先手动验证任务能正常完成，再设置自动运行。无人值守任务无法自动完成需要人工审批或补充信息的步骤，应先调整任务要求和权限。
    - question: 当前版本稳定吗？
      answer: AGW 处于 1.0 之前的开发阶段。数据库结构、接口和界面可能随版本变化，升级前应阅读发布说明并备份数据。
